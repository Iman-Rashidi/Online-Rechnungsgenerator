name: Telegram MCP checks

on:
  push:
    paths:
      - "telegram-mcp/**"
      - ".github/workflows/telegram-mcp-check.yml"
  pull_request:
    paths:
      - "telegram-mcp/**"
      - ".github/workflows/telegram-mcp-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-mcp
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: node --check src/server.js
      - name: Verify required files
        run: |
          test -f package.json
          test -f .env.example
          test -f src/server.js

      - name: Install Cloudflare Worker dependencies
        working-directory: telegram-mcp/worker
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Type-check Cloudflare Worker
        working-directory: telegram-mcp/worker
        run: npm run typecheck

      - name: Smoke-test Worker authentication
        working-directory: telegram-mcp/worker
        shell: bash
        run: |
          set -euo pipefail
          export MCP_ACCESS_TOKEN="0123456789abcdef0123456789abcdef"
          export TELEGRAM_BOT_TOKEN="123456:CI_TEST_TOKEN"
          npx wrangler dev --local --port 8787 --var "MCP_ACCESS_TOKEN:${MCP_ACCESS_TOKEN}" --var "TELEGRAM_BOT_TOKEN:${TELEGRAM_BOT_TOKEN}" > /tmp/rechnio-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health > /tmp/rechnio-health.json; then
              break
            fi
            sleep 1
          done

          grep -q '"mcp_auth_configured":true' /tmp/rechnio-health.json
          grep -q '"telegram_configured":true' /tmp/rechnio-health.json

          payload='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"rechnio-ci","version":"1.0.0"}}}'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST http://127.0.0.1:8787/mcp --header 'Content-Type: application/json' --header 'Accept: application/json, text/event-stream' --data "$payload")
          test "$status" = "401"

          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST http://127.0.0.1:8787/mcp --header 'Content-Type: application/json' --header 'Accept: application/json, text/event-stream' --header "Authorization: ${MCP_ACCESS_TOKEN}" --data "$payload")
          test "$status" = "401"

          response=$(curl --silent --write-out '\\n%{http_code}' --request POST http://127.0.0.1:8787/mcp --header 'Content-Type: application/json' --header 'Accept: application/json, text/event-stream' --header "Authorization: Bearer ${MCP_ACCESS_TOKEN}" --data "$payload")
          status="${response##*\\n'}"
          if [ "$status" != "200" ]; then
            echo "$response"
            cat /tmp/rechnio-worker.log
            echo "Expected valid Bearer token to initialize MCP, got HTTP $status"
            exit 1
          fi
