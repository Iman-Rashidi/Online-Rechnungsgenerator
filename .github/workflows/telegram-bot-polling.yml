name: Rechnio Telegram bot polling

on:
  push:
    branches:
      - main
  schedule:
    # GitHub may delay scheduled runs under load; avoid the top of the hour.
    - cron: "3/5 * * * *"
  workflow_dispatch:

concurrency:
  group: rechnio-telegram-polling
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-config:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
    steps:
      - name: Check whether production secrets are configured
        id: check
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$TELEGRAM_BOT_TOKEN" ]] || missing+=("TELEGRAM_BOT_TOKEN")
          [[ -n "$TELEGRAM_ALLOWED_USER_IDS" ]] || missing+=("TELEGRAM_ALLOWED_USER_IDS")
          [[ -n "$NOTION_API_KEY" ]] || missing+=("NOTION_API_KEY")

          if (( ${#missing[@]} > 0 )); then
            echo "Production polling is paused. Missing repository secrets: ${missing[*]}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "Production secrets are present. Values are not printed."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  poll:
    needs: check-config
    if: needs.check-config.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: telegram-mcp
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATA_SOURCE_ID: b2685397-3058-4bde-b9ef-4e51c8d63aa2
      STATE_FILE: data/telegram-updates.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: rechnio-telegram-npm-${{ runner.os }}-${{ hashFiles('telegram-mcp/package.json') }}

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: rechnio-playwright-${{ runner.os }}-chromium-${{ hashFiles('telegram-mcp/package.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Notion data-source access and invoice schema
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url = "https://api.notion.com/v1/data_sources/" + encodeURIComponent(process.env.NOTION_DATA_SOURCE_ID);
          const response = await fetch(url, {
            headers: {
              Authorization: "Bearer " + process.env.NOTION_API_KEY,
              "Notion-Version": "2026-03-11"
            },
            signal: AbortSignal.timeout(20000)
          });
          if (!response.ok) {
            const error = await response.json().catch(() => ({}));
            throw new Error("Notion access check failed: HTTP " + response.status + " (" + (error.code || "unknown") + ")");
          }
          const dataSource = await response.json();
          const expected = {
            "Invoice": "title",
            "Invoice number": "rich_text",
            "Original invoice number": "rich_text",
            "Document type": "select",
            "Customer": "rich_text",
            "Customer email": "email",
            "Invoice date": "date",
            "Due date": "date",
            "Net amount": "number",
            "Tax rate %": "number",
            "Gross amount": "number",
            "Status": "select",
            "Mahnung level": "select",
            "Notes": "rich_text"
          };
          const mismatches = Object.entries(expected).filter(([name, type]) => dataSource.properties?.[name]?.type !== type);
          if (mismatches.length) {
            throw new Error("Notion schema mismatch: " + mismatches.map(([name, type]) => name + " must be " + type).join("; "));
          }
          console.log("Notion data-source access verified; all " + Object.keys(expected).length + " required invoice properties match.");
          NODE

      - name: Restore Telegram update offset
        uses: actions/cache/restore@v4
        with:
          path: telegram-mcp/data
          key: rechnio-telegram-state-${{ github.run_id }}
          restore-keys: |
            rechnio-telegram-state-

      - name: Run one Telegram polling cycle
        run: node src/poll.js

      - name: Save Telegram update offset
        if: always()
        uses: actions/cache/save@v4
        with:
          path: telegram-mcp/data
          key: rechnio-telegram-state-${{ github.run_id }}
